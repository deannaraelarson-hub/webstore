<!DOCTYPE html>
<html>
<head>
    <title>SleekFleet Control</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        button { padding: 15px; width: 100%; margin-bottom: 10px; cursor: pointer; font-size: 16px; }
        .status { margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>
    <h2>SleekFleet Monitor</h2>
    <p>Status: <span id="status">Active</span></p>
    
    <!-- Button 1: Force Clipboard Read -->
    <button id="readClipBtn">📋 Force Read Clipboard</button>
    
    <!-- Button 2: Trigger Full Background Harvest -->
    <button id="harvestBtn">🚀 Trigger Deep Scan (Cookies/History)</button>

    <div class="status">
        <p>Last Action: <span id="lastAction">None</span></p>
    </div>

    <script>
        document.getElementById('readClipBtn').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                chrome.runtime.sendMessage({ action: "clipboardUpdate", data: text });
                document.getElementById('lastAction').innerText = "Clipboard: " + text.substring(0, 20) + "...";
            } catch (err) {
                alert("Click permission needed! Click inside a tab first.");
            }
        });

        document.getElementById('harvestBtn').addEventListener('click', () => {
            chrome.runtime.sendMessage({ action: "harvest" });
            document.getElementById('lastAction').innerText = "Deep Scan Sent";
        });
    </script>
</body>
</html>
