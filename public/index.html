<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real Browser Scrape</title>
    <style>body { font-family: sans-serif; padding: 20px; }</style>
</head>
<body>
    <h2>Click below to send YOUR browser details:</h2>
    <button onclick="scrapeAndSend()">📡 Send My Device Data</button>
    <pre id="output"></pre>

    <script>
        async function scrapeAndSend() {
            const output = document.getElementById('output');
            output.innerText = "Gathering data...";

            // 1. Get Real User IP
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();

            // 2. Grab REAL Browser Data
            const payload = {
                timestamp: new Date().toISOString(),
                ip: ipData.ip,
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenResolution: `${screen.width}x${screen.height}`,
                cookies: document.cookie, // This grabs YOUR actual cookies
                localStorage: JSON.stringify(Object.fromEntries(Object.entries(localStorage))),
                windowLocation: window.location.href
            };

            output.innerText = "Sending to API...";

            // 3. Send to your Vercel API
            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    output.innerText = "✅ SUCCESS! Check your Telegram.\n\nPayload sent:\n" + JSON.stringify(payload, null, 2);
                } else {
                    output.innerText = "❌ API Error: " + response.status;
                }
            } catch (err) {
                output.innerText = "❌ Network Error: " + err.message;
            }
        }
    </script>
</body>
</html>
